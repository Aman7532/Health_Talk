metadata:
  name: symptom-description
  namespace: healthcare-chatbot
data:
  symptom_Description.csv: |
    Disease,Description
    Fungal infection,"A fungal infection is caused by fungi that can affect the skin, nails, hair, or mucous membranes. Common symptoms include itching, redness, and sometimes a rash."
    Allergy,"An allergy is an immune system response to a foreign substance that's not typically harmful to your body. Common symptoms include sneezing, itching, and rashes."
    GERD,"Gastroesophageal reflux disease (GERD) is a chronic digestive disease that occurs when stomach acid flows back into the esophagus, irritating the lining. Symptoms include heartburn and acid regurgitation."
    Chronic cholestasis,"Chronic cholestasis is a condition where bile flow from the liver is reduced or blocked, leading to symptoms like jaundice, itching, and fatigue."
    Drug Reaction,"A drug reaction is an adverse response to a medication. Symptoms can range from mild rashes to severe skin reactions, fever, and organ damage."
    Peptic ulcer disease,"Peptic ulcer disease involves open sores that develop on the inside lining of the stomach, upper small intestine, or esophagus. The most common symptom is abdominal pain."
    AIDS,"Acquired immunodeficiency syndrome (AIDS) is a chronic, potentially life-threatening condition caused by the human immunodeficiency virus (HIV). It damages the immune system and interferes with the body's ability to fight infection."
    Diabetes,"Diabetes is a group of diseases that result in too much sugar in the blood. Symptoms include increased thirst, frequent urination, hunger, fatigue, and blurred vision."
    Gastroenteritis,"Gastroenteritis is an inflammation of the lining of the intestines caused by a virus, bacteria, or parasites. Symptoms include diarrhea, nausea, vomiting, and abdominal cramps."
    Bronchial Asthma,"Bronchial asthma is a chronic inflammatory disease of the airways characterized by variable and recurring symptoms, reversible airflow obstruction, and bronchospasm. Symptoms include wheezing, coughing, chest tightness, and shortness of breath."
    Hypertension,"Hypertension, or high blood pressure, is a condition where the force of blood against artery walls is consistently too high. It often has no symptoms but can lead to serious health problems."
    Migraine,"A migraine is a neurological condition characterized by intense, debilitating headaches often accompanied by nausea, vomiting, and sensitivity to light and sound."
    Cervical spondylosis,"Cervical spondylosis is a general term for age-related wear and tear affecting the spinal disks in your neck, causing pain and stiffness."
    Paralysis,"Paralysis is the loss of muscle function in part of your body, often accompanied by loss of feeling. It can be temporary or permanent and can affect any part of the body."
    Jaundice,"Jaundice is a condition where the skin, whites of the eyes, and mucous membranes turn yellow because of high levels of bilirubin in the blood."
    Malaria,"Malaria is a serious disease caused by a parasite that is transmitted via mosquito bites. Symptoms include fever, chills, and flu-like illness."
    Chicken pox,"Chicken pox is a highly contagious viral infection causing an itchy, blister-like rash. It's most common in children but can affect anyone who hasn't had it before."
    Dengue,"Dengue is a mosquito-borne viral infection causing severe flu-like symptoms and sometimes leading to a potentially lethal complication called severe dengue."
    Typhoid,"Typhoid is a bacterial infection that can spread throughout the body, affecting many organs. It's caused by a bacterium called Salmonella typhi."
    Hepatitis B,"Hepatitis B is a serious liver infection caused by the hepatitis B virus (HBV). It can be acute or chronic and can lead to liver failure, cirrhosis, or liver cancer."
    Fungal infection,"A fungal infection is caused by fungi that can affect the skin, nails, hair, or mucous membranes. Common symptoms include itching, redness, and sometimes a rash."
    Hepatitis C,"Hepatitis C is a viral infection that causes liver inflammation, sometimes leading to serious liver damage. The virus spreads through contaminated blood."
    Hepatitis E,"Hepatitis E is a liver disease caused by the hepatitis E virus (HEV). It's usually self-limiting but can be severe in pregnant women."
    Alcoholic hepatitis,"Alcoholic hepatitis is liver inflammation caused by drinking too much alcohol. It can lead to liver failure and death if drinking continues."
    Tuberculosis,"Tuberculosis (TB) is a bacterial infection that mainly affects the lungs but can also affect other parts of the body. It spreads through the air when infected people cough or sneeze."
    Common Cold,"The common cold is a viral infection of the upper respiratory tract, including the nose and throat. Symptoms include runny nose, sneezing, coughing, and sore throat."
    Pneumonia,"Pneumonia is an infection that inflames the air sacs in one or both lungs, which may fill with fluid. Symptoms include cough, fever, chills, and difficulty breathing."
    Dimorphic hemorrhoids(piles),"Hemorrhoids, also called piles, are swollen veins in the anus and lower rectum, similar to varicose veins. They can cause pain, itching, and bleeding."
    Heart attack,"A heart attack occurs when blood flow to a part of the heart is blocked, usually by a blood clot. Without blood, tissue loses oxygen and dies."
    Varicose veins,"Varicose veins are twisted, enlarged veins that appear close to the surface of the skin. They commonly affect the legs and can cause aching pain and discomfort."
    Hypothyroidism,"Hypothyroidism is a condition in which the thyroid gland doesn't produce enough thyroid hormone, leading to fatigue, increased sensitivity to cold, and weight gain."
    Hyperthyroidism,"Hyperthyroidism is a condition in which the thyroid gland produces too much thyroid hormone, leading to weight loss, rapid heart rate, and nervousness."
    Hypoglycemia,"Hypoglycemia is a condition characterized by abnormally low blood glucose (blood sugar) levels, usually below 70 mg/dL. Symptoms include shakiness, dizziness, and confusion."
    Osteoarthristis,"Osteoarthritis is the most common form of arthritis, characterized by the breakdown of joint cartilage and underlying bone. It causes pain, stiffness, and reduced motion."
    Arthritis,"Arthritis is inflammation of one or more joints, causing pain and stiffness that can worsen with age. The main types are osteoarthritis and rheumatoid arthritis."
    (vertigo) Paroymsal Positional Vertigo,"Vertigo is a sensation of spinning or dizziness. Paroxysmal positional vertigo is triggered by certain changes in head position, such as tipping the head up or down."
    Acne,"Acne is a skin condition that occurs when hair follicles become plugged with oil and dead skin cells. It often causes whiteheads, blackheads, or pimples."
    Urinary tract infection,"A urinary tract infection (UTI) is an infection in any part of the urinary system, including the kidneys, bladder, ureters, and urethra. Most infections involve the lower urinary tract."
    Psoriasis,"Psoriasis is a chronic skin condition that causes cells to build up rapidly on the surface of the skin, forming scales and itchy, dry patches."
    Impetigo,"Impetigo is a highly contagious skin infection that mainly affects infants and children. It's characterized by red sores that rupture, ooze, and form a honey-colored crust."
    itching,"Itching is an uncomfortable sensation on the skin that causes a desire to scratch. It can be caused by dry skin, allergies, insect bites, skin conditions, or certain medications."
    skin_rash,"A skin rash is a change in the skin's color, appearance, or texture. It may be localized or widespread, and can include redness, bumps, blisters, or scales."
    nodal_skin_eruptions,"Nodal skin eruptions are raised, solid lesions in the skin that are larger than 0.5 cm. They can be caused by infections, inflammatory conditions, or tumors."
    continuous_sneezing,"Continuous sneezing refers to repeated, forceful expulsion of air from the nose and mouth. It's commonly caused by allergies, infections, or irritants."
    shivering,"Shivering is involuntary muscle contraction and relaxation, often in response to cold temperatures or as part of a fever response to infection."
    chills,"Chills are feelings of coldness accompanied by shivering. They're often associated with fever and can be a sign of infection."
    joint_pain,"Joint pain is discomfort, aches, or soreness in any of the body's joints. It can be caused by injury, arthritis, or other inflammatory conditions."
    stomach_pain,"Stomach pain refers to discomfort in the abdominal area. It can be caused by various conditions including indigestion, infection, inflammation, or more serious issues."
    acidity,"Acidity refers to excess acid in the stomach causing discomfort, heartburn, or a sour taste in the mouth. It's often related to diet or stress."
    ulcers_on_tongue,"Ulcers on the tongue are open sores that can be painful. They may be caused by injury, infection, or autoimmune conditions."
